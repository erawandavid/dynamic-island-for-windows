name: Bug report
description: Something in Pulau doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search the existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Pulau
        2. Play a song in ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pulau version
      description: Shown in Settings → About, or the name of the zip you downloaded.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, run `winver`.
      placeholder: Windows 11 24H2 (build 26100)
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
    validations:
      required: true
  - type: input
    id: displays
    attributes:
      label: Displays
      description: Number of monitors, resolution and scaling of each.
      placeholder: 1 × 2560×1440 @ 125%
  - type: input
    id: apps
    attributes:
      label: Related apps
      description: For media issues, the app and version (e.g. Spotify 1.2.x, Edge, Chrome + YouTube).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Tray icon → "Open logs folder" (`%LOCALAPPDATA%\Pulau\logs`). Paste the relevant lines or attach the file. Logs stay on your PC unless you share them here.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / additional context
